name: rworkflows
'on':
  push:
    branches:
    - master
    - main
    - RELEASE_**
  pull_request:
    branches:
    - master
    - main
    - RELEASE_**
jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - os: ubuntu-latest
          r: devel
          bioc: devel
          cont: bioconductor/bioconductor_docker:devel
        - os: macOS-latest
          r: latest
          bioc: release
        - os: windows-latest
          r: latest
          bioc: release
    steps:
    - uses: neurogenomics/rworkflows@master
      with:
        run_bioccheck: false
        run_rcmdcheck: true
        as_cran: true
        run_vignettes: true
        has_testthat: true
        run_covr: true
        run_pkgdown: true
        run_docker: true
        docker_registry: ghcr.io
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        cache_version: cache-v2
